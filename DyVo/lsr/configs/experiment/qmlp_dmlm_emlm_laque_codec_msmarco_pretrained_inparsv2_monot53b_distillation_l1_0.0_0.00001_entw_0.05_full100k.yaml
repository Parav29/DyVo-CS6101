# @package _global_
# DYVO-REPRO paper-length variant of the official config qmlp_dmlm_emlm_laque_codec_msmarco_pretrained_inparsv2_monot53b_distillation_l1_0.0_0.00001_entw_0.05: all 100k steps of the paper.
# Only these settings differ (see repro_codec/REPORT.md):
#  - batch 4 x 4 gradient accumulation = effective batch 16 (paper): fits in ~6 GB
#  - L1 warm-up T: the regularizer steps once per micro-batch, so 50k optimizer steps x 4 = 200000 (same schedule)
#  - no mid-training evaluation (it only logs; no best-checkpoint selection)
defaults:
  - /experiment/qmlp_dmlm_emlm_laque_codec_msmarco_pretrained_inparsv2_monot53b_distillation_l1_0.0_0.00001_entw_0.05
  - _self_
training_arguments:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  evaluation_strategy: 'no'
loss:
  d_regularizer:
    T: 200000
