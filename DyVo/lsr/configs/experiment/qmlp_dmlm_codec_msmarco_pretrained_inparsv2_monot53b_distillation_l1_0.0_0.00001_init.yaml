# @package _global_
# DYVO-REPRO zero-training reference: evaluate the authors' MS MARCO init checkpoint (dyvo_init) on CODEC test.
# One optimizer step with learning_rate 0 leaves every weight (incl. lambda_ent) unchanged; then the official predict().
defaults:
  - /experiment/qmlp_dmlm_codec_msmarco_pretrained_inparsv2_monot53b_distillation_l1_0.0_0.00001
  - _self_
training_arguments:
  per_device_train_batch_size: 4
  max_steps: 1
  learning_rate: 0.0
  warmup_ratio: 0.0
  evaluation_strategy: 'no'
  save_strategy: 'no'
